name: Extract AutoClip AI source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          mkdir -p /tmp/autoclip
          unzip -o AutoClipAI_v0.6_source.zip -d /tmp/autoclip

          if [ ! -d "/tmp/autoclip/AutoClipAI" ]; then
            echo "Folder AutoClipAI tidak ditemukan!"
            exit 1
          fi

          rsync -a \
            --exclude='/.github/' \
            /tmp/autoclip/AutoClipAI/ ./

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract AutoClip AI source v0.6" || echo "No changes"
          git push
